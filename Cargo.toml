[workspace]
resolver = "2"
members = [
    "crates/cyber-runner-core",
    "crates/cyber-runner-engine",
    "crates/cyber-runner-cli",
    "src-tauri",
]

[workspace.package]
version = "0.2.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"

[workspace.dependencies]
cyber-runner-core = { path = "crates/cyber-runner-core" }
cyber-runner-engine = { path = "crates/cyber-runner-engine" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "net", "signal"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dirs = "6"
# Pinned exactly: idevice makes breaking changes on every 0.1.x release.
idevice = { version = "=0.1.68", default-features = false, features = [
    "ring",
    "usbmuxd",
    "pair",
    "amfi",
    "core_device_proxy",
    "tunnel_tcp_stack",
    "rsd",
    "dvt",
    "location_simulation",
    "mobile_image_mounter",
    "tss",
] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
