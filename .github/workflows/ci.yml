name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-2022, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: cargo fmt
        run: cargo fmt --all -- --check
      - name: clippy (core, engine, cli)
        run: cargo clippy -p cyber-runner-core -p cyber-runner-engine -p cyber-runner-cli --all-targets -- -D warnings
      - name: tests (core, engine, cli)
        run: cargo test -p cyber-runner-core -p cyber-runner-engine -p cyber-runner-cli
      - name: CLI smoke (no device attached)
        shell: bash
        run: |
          cargo run -q -p cyber-runner-cli -- devices || true
          cargo run -q -p cyber-runner-cli -- run --km 0.1 && exit 1 || echo "failed as expected without a phone"

  app:
    name: App (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: npm ci
      - name: svelte-check
        run: npm run check
      - name: build frontend
        run: npm run build
      - name: clippy + tests (tauri host)
        run: |
          cargo clippy -p cyber-runner-app --all-targets -- -D warnings
          cargo test -p cyber-runner-app
