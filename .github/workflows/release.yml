# Builds installers. Run manually (Actions → Release → Run workflow) or push
# a tag like v0.2.0. Artifacts are attached to a draft GitHub release.
name: Release

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            args: --target universal-apple-darwin
            rust_targets: aarch64-apple-darwin,x86_64-apple-darwin
          - os: windows-latest
            args: ""
            rust_targets: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}
      - uses: Swatinem/rust-cache@v2
      - run: npm ci
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || format('build-{0}', github.run_number) }}
          releaseName: Cyber Runner ${{ github.ref_type == 'tag' && github.ref_name || format('build {0}', github.run_number) }}
          releaseDraft: true
          prerelease: ${{ github.ref_type != 'tag' }}
          args: ${{ matrix.args }}
      - name: Build CLI
        shell: bash
        run: |
          cargo build --release -p cyber-runner-cli
          mkdir -p cli && cp target/release/cyber-runner${{ runner.os == 'Windows' && '.exe' || '' }} cli/
      - uses: actions/upload-artifact@v4
        with:
          name: cyber-runner-cli-${{ runner.os }}
          path: cli/
